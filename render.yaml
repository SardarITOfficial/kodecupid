# Render blueprint for the KodeCupid API.
#
# IMPORTANT: Render's managed PostgreSQL does not ship PostGIS. Create the
# database on Supabase or Neon (both support `CREATE EXTENSION postgis`) and paste
# its connection string into DATABASE_URL.
services:
  - type: web
    name: kodecupid-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: 30
      - key: COOKIE_SECURE
        value: true
      - key: SMS_PROVIDER
        value: console
      - key: OTP_ALLOW_DEBUG_CODE
        value: true
      - key: OTP_DEBUG_CODE
        value: 246810
      - key: TERMS_VERSION
        value: "1.0"
      - key: GUIDELINES_VERSION
        value: "1.0"
      - key: PRIVACY_VERSION
        value: "1.0"
      - key: STORAGE_DRIVER
        value: local
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_MODERATOR_EMAIL
        sync: false
      - key: SEED_MODERATOR_PASSWORD
        sync: false
    disk:
      name: kodecupid-storage
      mountPath: /app/apps/api/storage
      sizeGB: 1
